<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas y Formularios HTML</title>
    <meta name="author" content="Antonio Zavala">
</head>
<body>
    <h1>Listas y Formularios</h1>

    <div>
        <h2>Listas</h2>
        <h3>Listas no ordenadas</h3>
        <ul>
            <li>Leche</li>
            <li>Carne</li>
            <li>Pan</li>
            <li>Jamón</li>
            <li>Papel</li>
        </ul>

        <h3>Listas ordenadas</h3>
        <ol type="i">
            <li>Primero</li>
            <li>Segundo</li>
            <li>Tercero</li>
            <li>Cuarto</li>
            <li>Quinto</li>
        </ol>
    </div>
</body>
</html>
